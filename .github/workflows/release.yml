name: Release
on:
  push:
    tags: ['v*']

# Every external action is pinned to a reviewed commit, not a movable tag or
# branch. To update one, resolve the new tag to its commit and review the diff.
# Only the publish job can write to the repository.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: '' }
          # Cross-compile on the standard runner; hosted ARM runners require
          # separate billing availability in private repositories.
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, ext: '' }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: '.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - name: Test Windows before publishing
        if: runner.os == 'Windows'
        run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/branchdiff${{ matrix.ext }}" "branchdiff-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branchdiff-${{ matrix.target }}
          path: branchdiff-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: branchdiff-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum branchdiff-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # Private repositories require GitHub Enterprise Cloud. Opt in only
        # when that feature is available; checksums and releases work on all plans.
        if: github.event.repository.private == false || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true'
        with:
          subject-path: dist/branchdiff-*
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/branchdiff-*
            dist/SHA256SUMS
