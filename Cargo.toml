[package]
name = "branchdiff"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Fast terminal UI for reviewing git worktrees against a base branch"

[dependencies]
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ignore = "0.4"
notify = "8"
nucleo-matcher = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
toml = "1"
unicode-width = "0.2"

[dev-dependencies]
criterion = "0.8"
insta = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bench]]
name = "render"
harness = false
