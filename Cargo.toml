[package]
name = "branchdiff"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
description = "Fast terminal UI for reviewing git worktrees against a base branch"

[lib]
bench = false

[[bin]]
name = "branchdiff"
path = "src/main.rs"
bench = false

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ignore = "0.4"
notify = "8"
nucleo-matcher = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
toml = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8"
insta = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bench]]
name = "render"
harness = false
